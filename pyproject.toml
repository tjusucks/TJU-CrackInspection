[project]
name = "crack-inspection"
version = "0.1.0"
description = "Automatic, robust and real-time crack inspection and detection system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.13.0.92",
    "tqdm>=4.67.3",
    "types-tqdm>=4.67.3.20260408",
    "ultralytics>=8.4.37",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "mypy>=1.20.1",
    "ruff>=0.15.10",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
